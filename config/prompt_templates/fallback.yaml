# Fallback templates
# Contains both fixed-response templates and model-fallback prompt templates.
# Fixed responses: used directly as the reply when fallback_strategy = "fixed"
# Model prompts: used as the prompt to the LLM when fallback_strategy = "model"
templates:
  # --- Fixed response templates ---
  - id: "default_fallback"
    name: "Standard Fallback"
    description: "Standard fallback response template"
    i18n:
      zh-CN:
        name: "标准兜底"
        description: "友好告知无法回答并提供建议"
      en-US:
        name: "Standard Fallback"
        description: "Friendly message with suggestions when unable to answer"
      ko-KR:
        name: "표준 폴백"
        description: "친절하게 답변 및 제안을 드릴 수 없음을 알려드립니다."
      ja-JP:
        name: "標準フォールバック"
        description: "回答できないことを丁寧に伝え、提案を提示するメッセージ"
      vi-VN:
        name: "Phản hồi dự phòng chuẩn"
        description: "Thông báo lịch sự khi không tìm thấy thông tin trong kho tài liệu kèm gợi ý"
    default: true
    content: |
      Xin lỗi, tôi không tìm thấy nội dung liên quan trực tiếp đến câu hỏi của bạn trong kho tài liệu.

      Bạn có thể thử:
      1. Diễn đạt lại câu hỏi với từ khóa cụ thể hơn (tên văn bản, số hiệu, điều khoản, nơi ban hành)
      2. Kiểm tra xem tài liệu cần tra cứu đã được tải lên kho tri thức chưa
      3. Chia nhỏ câu hỏi thành các ý cụ thể hơn

      Nếu bạn có câu hỏi khác, tôi sẵn sàng tiếp tục hỗ trợ bạn.

      ## CRITICAL: Language Rule
      - ALWAYS respond in {{language}}

  - id: "polite_fallback"
    name: "Polite Fallback"
    description: "More polite and friendly fallback response"
    i18n:
      zh-CN:
        name: "礼貌兜底"
        description: "更加礼貌详细的无法回答提示"
      en-US:
        name: "Polite Fallback"
        description: "More polite and detailed unable-to-answer message"
      ko-KR:
        name: "정중한 폴백"
        description: "더 정중하고 자세한 답변 불가 프롬프트"
      ja-JP:
        name: "丁寧なフォールバック"
        description: "より丁寧で詳細な回答不可メッセージ"
      vi-VN:
        name: "Phản hồi dự phòng lịch sự"
        description: "Thông báo chi tiết và lịch sự khi chưa thể trả lời câu hỏi"
    content: |
      Xin lỗi, hiện tại tôi chưa thể cung cấp câu trả lời chính xác cho câu hỏi của bạn vì kho tài liệu chưa có thông tin phù hợp.

      Gợi ý dành cho bạn:
      1. Thử tìm kiếm bằng từ khóa khác hoặc tên văn bản cụ thể
      2. Chia câu hỏi thành các câu hỏi nhỏ chi tiết hơn
      3. Bổ sung tài liệu liên quan vào kho tri thức

      Cảm ơn bạn đã thông cảm!

      ## CRITICAL: Language Rule
      - ALWAYS respond in {{language}}

  - id: "brief_fallback"
    name: "Brief Fallback"
    description: "Short fallback response"
    i18n:
      zh-CN:
        name: "简洁兜底"
        description: "简短的无法回答提示"
      en-US:
        name: "Brief Fallback"
        description: "Short unable-to-answer message"
      ko-KR:
        name: "간단한 폴백"
        description: "대답할 수 없는 짧은 프롬프트"
      ja-JP:
        name: "簡潔なフォールバック"
        description: "短い回答不可メッセージ"
      vi-VN:
        name: "Phản hồi dự phòng ngắn gọn"
        description: "Thông báo ngắn gọn khi không tìm thấy thông tin"
    content: "Xin lỗi, tôi không tìm thấy thông tin phù hợp trong kho tài liệu để trả lời câu hỏi này. Vui lòng thử lại với từ khóa cụ thể hơn."

  # --- Model fallback prompt templates (for fallback_strategy = "model") ---
  - id: "model_fallback"
    name: "Model Fallback"
    description: "Fallback prompt that delegates to the model for generation"
    i18n:
      zh-CN:
        name: "模型兜底提示"
        description: "引导模型基于通用知识回答的提示词"
      en-US:
        name: "Model Fallback Prompt"
        description: "Prompt to guide model to answer with general knowledge"
      ko-KR:
        name: "모델 폴백 프롬프트"
        description: "일반 지식을 바탕으로 모델이 답변하도록 안내하는 프롬프트"
      ja-JP:
        name: "モデルフォールバックプロンプト"
        description: "一般知識に基づいて回答するようモデルを誘導するプロンプト"
      vi-VN:
        name: "Prompt dự phòng bằng mô hình"
        description: "Hướng dẫn mô hình gợi ý tài liệu liên quan hoặc trả lời dựa trên kiến thức chung"
    mode: "model"
    content: |
      No content directly matched the user's query via search. However, the knowledge base contains the following documents:

      {{kb_documents}}

      Important Notes:
      1. If the document listing above is available, use it to help answer the user's question (e.g., list relevant documents, suggest which documents may contain the information they need)
      2. If the document listing is empty, use your general knowledge and clearly inform the user that the answer is not from the knowledge base
      3. If the question involves specific domains or requires the latest information, suggest the user consult official resources
      4. Maintain accuracy and objectivity in the response

      ## CRITICAL: Language Rule
      - ALWAYS respond in {{language}}

      User question: {{query}}

  - id: "default_fallback_prompt"
    name: "Standard Fallback Prompt"
    description: "Default prompt that delegates to the model when KB has no relevant results"
    i18n:
      zh-CN:
        name: "标准兜底 Prompt"
        description: "知识库无相关结果时引导模型回答的默认提示词"
      en-US:
        name: "Standard Fallback Prompt"
        description: "Default prompt that delegates to the model when KB has no relevant results"
      ko-KR:
        name: "표준 폴백 프롬프트"
        description: "KB에 관련 결과가 없을 때 모델에 위임하는 기본 프롬프트"
      ja-JP:
        name: "標準フォールバックプロンプト"
        description: "ナレッジベースに関連する結果がない場合にモデルへ委ねるデフォルトのプロンプト"
      vi-VN:
        name: "Prompt dự phòng chuẩn"
        description: "Prompt mặc định hướng dẫn mô hình trả lời khi không tìm thấy kết quả trong kho tài liệu"
    mode: "model"
    content: |
      Bạn là Trợ lý Tra cứu Tài liệu thông minh (WeKnora RAG).

      Không tìm thấy đoạn văn bản nào khớp trực tiếp với câu hỏi của người dùng. Tuy nhiên, kho tri thức hiện có các tài liệu sau:

      {{kb_documents}}

      ## Yêu cầu phản hồi
      - Coi danh sách tài liệu trên là siêu dữ liệu (metadata): dùng để giới thiệu tên tài liệu hoặc gợi ý tài liệu có thể liên quan, không tự suy diễn nội dung chi tiết bên trong tài liệu chưa đọc.
      - Nếu danh sách tài liệu trống hoặc không liên quan, hãy thông báo rõ rằng thông tin này không có trong kho tài liệu trước khi chia sẻ kiến thức chung (nếu phù hợp).
      - Ngắn gọn, rõ ràng, lịch sự và chuyên nghiệp.
      - Ngôn ngữ phản hồi mặc định: {{language}} (trừ khi người dùng yêu cầu ngôn ngữ khác).

      ## Câu hỏi của người dùng:
      {{query}}
